  <text x="80" y="175" font-size="64" font-weight="800">DB LEGENDS</text>
  <text x="80" y="232" font-size="34" fill="#d8e7ff">IN-GAME GUIDE HUB · PvP · BUILDS · ART · BOOKS</text>
  <text x="80" y="300" font-size="23" fill="#a8b9db">DEUTSCH · ENGLISH · META SNAPSHOTS · STRATEGY</text>
  <text x="80" y="382" font-size="22" fill="#ffe38a">SPARKING + LEGEND LIMITED</text>
</g>
<g transform="translate(1050 105)">
