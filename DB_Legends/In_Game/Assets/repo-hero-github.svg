<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="t d">
<title id="t">DB Legends In-Game Guide Hub</title><desc id="d">Visual sci-fi banner for the unofficial CryoGameHelp DB Legends repository.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#101942"/><stop offset="1" stop-color="#18051e"/></linearGradient>
  <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#36a8ff"/><stop offset=".5" stop-color="#9b5cff"/><stop offset="1" stop-color="#ffd24a"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#87a8ff" stroke-opacity=".09"/></pattern>
</defs>
<rect width="1600" height="520" fill="url(#bg)"/>
<rect width="1600" height="520" fill="url(#grid)"/>
<path d="M0 420 C300 280 510 470 780 310 S1260 120 1600 250" fill="none" stroke="url(#beam)" stroke-width="10" opacity=".9" filter="url(#glow)"/>
<circle cx="250" cy="250" r="140" fill="#2b8dff" opacity=".12"/><circle cx="1350" cy="230" r="170" fill="#be54ff" opacity=".12"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#fff">
