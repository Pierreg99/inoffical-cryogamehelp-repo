<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="t d"><title id="t">Guide content pipeline</title><desc id="d">Visual pipeline from research to playable team guides and books.</desc><defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#071122"/><stop offset="1" stop-color="#24102c"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#37b7ff"/><stop offset="1" stop-color="#bd6cff"/></linearGradient></defs><rect width="1600" height="500" rx="28" fill="url(#b)"/><g font-family="Arial,Helvetica,sans-serif" fill="#fff"><text x="70" y="70" font-size="34" font-weight="800">RESEARCH → BUILD → VISUALIZE → PUBLISH</text><text x="70" y="104" font-size="18" fill="#a9c9f3">A repeatable workflow for the unofficial CryoGameHelp guide system</text><g fill="#101b39" stroke="#4bbcff" stroke-width="3"><rect x="60" y="185" width="330" height="190" rx="22"/><rect x="445" y="185" width="330" height="190" rx="22"/><rect x="830" y="185" width="330" height="190" rx="22"/><rect x="1215" y="185" width="330" height="190" rx="22"/></g><g font-size="26" font-weight="700"><text x="95" y="235">01 · RESEARCH</text><text x="480" y="235">02 · BUILD</text><text x="865" y="235">03 · VISUALIZE</text><text x="1250" y="235">04 · PUBLISH</text></g><g font-size="18" fill="#cddcff"><text x="95" y="275">Meta snapshots</text><text x="95" y="304">Sources &amp; evidence</text><text x="95" y="333">Patch awareness</text><text x="480" y="275">Teams</text><text x="480" y="304">Equipment</text><text x="480" y="333">Match plans</text><text x="865" y="275">Diagrams</text><text x="865" y="304">Bilderbuch</text><text x="865" y="333">Manga / SVG art</text><text x="1250" y="275">README</text><text x="1250" y="304">PDF / EPUB</text><text x="1250" y="333">Changelog</text></g><g stroke="url(#a)" stroke-width="7" fill="none"><path d="M395 280H445"/><path d="M780 280H830"/><path d="M1165 280H1215"/></g></g></svg>