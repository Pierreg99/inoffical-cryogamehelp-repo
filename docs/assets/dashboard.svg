<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">CRYOGAMEHELP Universal Interactive Dashboard</title><desc id="d">Four visual game cards for Dragon Ball Legends, Pokémon TCG Pocket, Pokémon TCG Live and Pokémon GO connected to a shared build, guides, meta and events dashboard.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050b18"/><stop offset=".5" stop-color="#14234a"/><stop offset="1" stop-color="#260b30"/></linearGradient><linearGradient id="gl" x1="0" x2="1"><stop stop-color="#42d8ff"/><stop offset=".5" stop-color="#8c6cff"/><stop offset="1" stop-color="#ff58c8"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1400" height="760" rx="34" fill="url(#bg)"/><path d="M60 120H1340" stroke="url(#gl)" stroke-width="3"/><text x="60" y="72" fill="#fff" font-size="42" font-family="Arial,Helvetica,sans-serif" font-weight="800">CRYOGAMEHELP · UNIVERSAL GAME HUB</text><text x="60" y="102" fill="#a8c9ef" font-size="18" font-family="Arial,Helvetica,sans-serif">GUIDES · BUILDS · DECKS · META · PROGRESSION · EVENTS · VISUAL DOCS</text><g font-family="Arial,Helvetica,sans-serif"><g filter="url(#g)"><rect x="55" y="150" width="295" height="210" rx="22" fill="#101a37" stroke="#238cff" stroke-width="4"/><rect x="370" y="150" width="295" height="210" rx="22" fill="#201a0e" stroke="#f6c75d" stroke-width="4"/><rect x="685" y="150" width="295" height="210" rx="22" fill="#260f20" stroke="#ff4b73" stroke-width="4"/><rect x="1000" y="150" width="345" height="210" rx="22" fill="#0c252b" stroke="#31e1a0" stroke-width="4"/></g><g fill="#fff" font-size="24" font-weight="800"><text x="80" y="200">DRAGON BALL LEGENDS</text><text x="395" y="200">POKÉMON TCG POCKET</text><text x="710" y="200">POKÉMON TCG LIVE</text><text x="1025" y="200">POKÉMON GO</text></g><g fill="#bcd5f