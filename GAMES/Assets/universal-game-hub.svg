<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">CRYOGAMEHELP Universal Game Hub</title>
<desc id="desc">A visual hub connecting Dragon Ball Legends, Pokémon TCG Pocket, Pokémon TCG Live, Pokémon GO, shared guides, meta research, builds, progression, events and visual assets.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060b18"/><stop offset=".48" stop-color="#151b3c"/><stop offset="1" stop-color="#250a2d"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43d5ff"/><stop offset=".5" stop-color="#8d6cff"/><stop offset="1" stop-color="#ff58c8"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="760" rx="42" fill="url(#bg)"/>
<path d="M80 155H1520" stroke="url(#line)" stroke-width="3" opacity=".9"/>
<g fill="#fff" font-family="Arial,Helvetica,sans-serif">
  <text x="80" y="94" font-size="52" font-weight="800">CRYOGAMEHELP</text>
  <text x="80" y="138" font-size="25" fill="#bcd7ff">UNIVERSAL GAME KNOWLEDGE BASE</text>
  <text x="80" y="205" font-size="21" fill="#dfe9ff">One architecture for guides, builds, meta, progression, events and visual documentation.</text>

  <g filter="url(#glow)">
    <circle cx="800" cy="430" r="116" fill="#0c1430" stroke="url(#line)" stroke-width="7"/>
    <text x="800" y="416" text-anchor="middle" font-size="32" font-weight="800">GAME</text>
    <text x="800" y="457" text-anchor="middle" font-size="32" font-weight="800">HUB</text>
  </g>

  <g fill="#0d1733" stroke="#55cfff" stroke-width="3">
    <rect x="90" y="285" width="300" height="120" rx="26"/>
    <rect x="450" y="285" width="300" height="120" rx="26"/>
    <rect x="850" y="285" width="300" height="120" rx="26"/>
    <rect x="1210" y="285" width="300" height="120" rx="26"/>
  </g>
  <g font-size="25" font-weight="800">
    <text x="240" y="330" text-anchor="middle">DB LEGENDS</text>
    <text x="600" y="330" text-anchor="middle">TCG POCKET</text>
    <text x="1000" y="330" text-anchor="middle">TCG LIVE</text>
    <text x="1360" y="330" text-anchor="middle">POKÉMON GO</text>
  </g>
  <g font-size="17" fill="#c9d7f5">
    <text x="240" y="364" text-anchor="middle">PvP · Teams · Equipment</text>
    <text x="600" y="364" text-anchor="middle">Collection · 20-card decks</text>
    <text x="1000" y="364" text-anchor="middle">Decks · Legality · Ladder</text>
    <text x="1360" y="364" text-anchor="middle">Raids · GBL · Events</text>
  </g>

  <g stroke="url(#line)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M390 345H670"/>
    <path d="M750 345H684"/>
    <path d="M850 345H916"/>
    <path d="M1150 345H1210"/>
  </g>

  <g fill="#101936" stroke="#8d6cff" stroke-width="3">
    <rect x="170" y="570" width="210" height="82" rx="18"/>
    <rect x="430" y="570" width="210" height="82" rx="18"/>
    <rect x="690" y="570" width="210" height="82" rx="18"/>
    <rect x="950" y="570" width="210" height="82" rx="18"/>
    <rect x="1210" y="570" width="210" height="82" rx="18"/>
  </g>
  <g font-size="18" font-weight="700" text-anchor="middle">
    <text x="275" y="604">GUIDES</text><text x="535" y="604">BUILDS</text><text x="795" y="604">META</text><text x="1055" y="604">PROGRESSION</text><text x="1315" y="604">EVENTS / ASSETS</text>
  </g>
  <g font-size="15" fill="#abc2e9" text-anchor="middle">
    <text x="275" y="629">beginner → advanced</text><text x="535" y="629">decks · teams · loadouts</text><text x="795" y="629">dated evidence</text><text x="1055" y="629">ranks · collection · resources</text><text x="1315" y="629">updates · visual docs</text>
